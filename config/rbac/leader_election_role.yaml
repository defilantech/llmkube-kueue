apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: llmkube-kueue-leader-election
  namespace: llmkube-kueue-system
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create", "get", "list", "update", "patch", "watch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
