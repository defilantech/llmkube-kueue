apiVersion: apps/v1
kind: Deployment
metadata:
  name: llmkube-kueue-webhook
  labels:
    app.kubernetes.io/name: llmkube-kueue
    app.kubernetes.io/component: webhook
spec:
  # Two replicas plus the PDB keep labeled-create admission available
  # through node drains and rollouts (failurePolicy is Fail).
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: llmkube-kueue
      app.kubernetes.io/component: webhook
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llmkube-kueue
        app.kubernetes.io/component: webhook
    spec:
      serviceAccountName: llmkube-kueue-controller
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: webhook
          image: ghcr.io/defilantech/llmkube-kueue
          # Explicit so kind-loaded local images are always used; a pull of the
          # never-pushed dev tag would fail the rollout.
          imagePullPolicy: IfNotPresent
          args: ["webhook", "--webhook-cert-dir=/certs"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          ports:
            - name: webhook
              containerPort: 9443
          volumeMounts:
            - name: certs
              mountPath: /certs
              readOnly: true
          livenessProbe:
            httpGet: {path: /healthz, port: 8081}
            initialDelaySeconds: 15
          readinessProbe:
            httpGet: {path: /readyz, port: 8081}
            initialDelaySeconds: 5
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
      volumes:
        - name: certs
          secret:
            secretName: llmkube-kueue-webhook-cert
