# A plain batch Job on the SAME Kueue stack, borrowing the GPUs inference
# lends. Kueue's built-in batch/job integration handles it; when inference
# scales up and reclaims, jobs like this are the side that gets preempted.
apiVersion: batch/v1
kind: Job
metadata:
  name: finetune-borrower
  namespace: default
  labels:
    kueue.x-k8s.io/queue-name: batch-queue
spec:
  suspend: true
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: train
          image: busybox:1.36
          command: ["sh", "-c", "echo training && sleep 30"]
          resources:
            requests:
              nvidia.com/gpu: 1
            limits:
              nvidia.com/gpu: 1
