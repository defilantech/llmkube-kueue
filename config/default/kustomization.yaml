apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: llmkube-kueue-system
resources:
  - ../rbac
  - ../manager
  - ../certmanager
  - ../webhook
# The suspend-defaulting webhook serves with cert-manager-issued certs, so
# cert-manager is now a deploy prerequisite: `make cert-manager` before
# `make deploy`.
images:
  - name: ghcr.io/defilantech/llmkube-kueue
    newTag: dev
