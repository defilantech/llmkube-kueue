image:
  repository: ghcr.io/defilantech/llmkube-kueue
  tag: ""
  pullPolicy: IfNotPresent
controller:
  replicas: 1
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}
rbac:
  create: true
serviceAccount:
  create: true
  name: llmkube-kueue-controller
webhook:
  # Requires cert-manager: the serving certificate is cert-manager issued.
  # Disable only if you gate suspend defaulting some other way; without
  # the webhook, queue-labeled CREATEs start unsuspended and the
  # reconciler suspends them post-hoc.
  enabled: true
  replicas: 2
