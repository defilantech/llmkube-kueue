{{- if .Values.webhook.enabled }}
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: llmkube-kueue-selfsigned
  namespace: {{ .Release.Namespace }}
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: llmkube-kueue-webhook-cert
  namespace: {{ .Release.Namespace }}
spec:
  dnsNames:
    - llmkube-kueue-webhook.{{ .Release.Namespace }}.svc
    - llmkube-kueue-webhook.{{ .Release.Namespace }}.svc.cluster.local
  issuerRef:
    kind: Issuer
    name: llmkube-kueue-selfsigned
  secretName: llmkube-kueue-webhook-cert
{{- end }}
