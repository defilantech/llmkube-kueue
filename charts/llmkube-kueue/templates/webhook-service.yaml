{{- if .Values.webhook.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: llmkube-kueue-webhook
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app.kubernetes.io/name: llmkube-kueue
    app.kubernetes.io/component: webhook
  ports:
    - port: 443
      targetPort: 9443
{{- end }}
